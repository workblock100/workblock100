<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shift Happens</title>
<style>
  @font-face { font-family: Bangers; src: url(fonts/Bangers-Regular.ttf); }
  @font-face { font-family: Lucky; src: url(fonts/LuckiestGuy-Regular.ttf); }
  @font-face { font-family: Nunito; src: url(fonts/Nunito.ttf); font-weight: 200 1000; }
  :root { --bg: #111; --fg: #fff; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: Nunito, system-ui, sans-serif; }
  #stage { position: relative; height: 100vh; aspect-ratio: 9 / 16; max-width: 100vw; margin: 0 auto; }
  canvas { width: 100%; height: 100%; display: block; }
  #play { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.45); border: 0; color: #fff; font: 900 28px Nunito, sans-serif; cursor: pointer; }
  #play span { background: #ff3b55; padding: 18px 34px; border-radius: 999px; box-shadow: 0 8px 30px rgba(0,0,0,.4); }
  body.capture #play { display: none; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="1080" height="1920"></canvas>
  <button id="play"><span>Play episode</span></button>
</div>
<audio id="audio" preload="auto"></audio>
<script src="engine.js"></script>
<script src="build/timeline.js"></script>
<script src="build/ep2/timeline.js"></script>
<script src="build/ep3/timeline.js"></script>
<script src="build/ep4/timeline.js"></script>
<script src="ep1.js"></script>
<script src="ep2.js"></script>
<script src="ep3.js"></script>
<script src="ep4.js"></script>
<script src="main.js"></script>
</body>
</html>
