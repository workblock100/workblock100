<!doctype html>
<html><head><meta charset="utf-8"><title>WX20 demo (not loaded by index.html)</title>
<style>body{margin:0;background:#111;color:#ddd;font:14px sans-serif}canvas{display:block}</style></head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="ep18_fx.js"></script>
<script src="ep20_fx.js"></script>
<script>
'use strict';
/* WX20 demo and harness (standalone: loads only ep18_fx.js and ep20_fx.js). The driver is wx20_test.js (Playwright); open this page by hand with ?case=snow&t=1.2 to see one case.
 * A case is { view: [w, h], draw(c, t) }: it draws into an offscreen canvas of its own native size, and sheet() tiles cases x times into one picture. Every function is shown on a dark and on a pale background. */
const S = window.SN20, L = window.L20, F = window.FX18, PI = Math.PI, TAU = PI * 2;
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const BG = {
  night(c, w, h) { const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#0d1838'); g.addColorStop(.7, '#1a2c52'); g.addColorStop(1, '#223a60'); c.fillStyle = g; c.fillRect(0, 0, w, h); },
  pale(c, w, h) { c.fillStyle = '#dfe7ea'; c.fillRect(0, 0, w, h); c.fillStyle = '#c3cdd0'; c.fillRect(0, h * .74, w, h * .26); c.fillStyle = 'rgba(0,0,0,.06)'; c.fillRect(0, h * .74, w, 3); },
  room(c, w, h) { const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#b9a98c'); g.addColorStop(.7, '#a89677'); g.addColorStop(.7, '#6e5b44'); g.addColorStop(1, '#4e402f'); c.fillStyle = g; c.fillRect(0, 0, w, h); c.strokeStyle = 'rgba(0,0,0,.12)'; c.lineWidth = 2; for (let x = 0; x < w; x += 90) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, h * .7); c.stroke(); } },
  grid(c, w, h) { c.fillStyle = '#5a6068'; c.fillRect(0, 0, w, h); c.strokeStyle = 'rgba(255,255,255,.12)'; c.lineWidth = 1; for (let x = 0; x < w; x += 60) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, h); c.stroke(); } for (let y = 0; y < h; y += 60) { c.beginPath(); c.moveTo(0, y); c.lineTo(w, y); c.stroke(); } },
};
/* a stand-in character: a round red body, two eyes (the engine-mode test in wx20_test.js draws the real Strawberry) */
function dummy(c, x, y, s = 1, col = '#d6303a') {
  c.save(); c.translate(x, y); c.scale(s, s);
  c.fillStyle = col; c.beginPath(); c.ellipse(0, -150, 95, 120, 0, 0, TAU); c.fill();
  c.fillStyle = '#3d9a45'; c.beginPath(); c.ellipse(0, -265, 60, 22, 0, 0, TAU); c.fill();
  c.fillStyle = '#fff'; for (const dx of [-34, 34]) { c.beginPath(); c.ellipse(dx, -170, 20, 26, 0, 0, TAU); c.fill(); }
  c.fillStyle = '#222'; for (const dx of [-34, 34]) { c.beginPath(); c.arc(dx + 3, -166, 9, 0, TAU); c.fill(); }
  c.strokeStyle = '#4a1010'; c.lineWidth = 6; c.lineCap = 'round'; c.beginPath(); c.arc(0, -120, 30, .25, PI - .25); c.stroke();
  c.restore();
}
const label = (c, s, x, y, col = '#fff') => { c.save(); c.font = '600 20px sans-serif'; c.fillStyle = col; c.shadowColor = '#000'; c.shadowBlur = 4; c.fillText(s, x, y); c.restore(); };
const CASES = {};

/* ---- batch 1: the clock, wind, snow, the light pass */
CASES.clock = { view: [900, 520], draw(c, t) {
  BG.grid(c, 900, 520); const X = m => 40 + (m - 840) / (1860 - 840) * 820;
  c.lineWidth = 3; c.strokeStyle = '#8fd0ff'; c.beginPath(); for (let m = 840; m <= 1860; m += 5) { const y = 440 - S.depthAt(m) * 380; m === 840 ? c.moveTo(X(m), y) : c.lineTo(X(m), y); } c.stroke();
  c.strokeStyle = '#ffcf6a'; c.beginPath(); for (let i = 0; i <= 600; i++) { const tt = i / 600 * 20, y = 250 - S.wind(tt, [[6, 2, .7], [13, 1.2, -.6]]) * 120; i ? c.lineTo(40 + i / 600 * 820, y) : c.moveTo(40, y); } c.stroke();
  for (const [k, m] of Object.entries(S.SCENE_CLOCK)) { c.fillStyle = '#fff'; c.fillRect(X(m), 440, 2, 14); label(c, k, X(m) - 18, 472); }
  label(c, 'depthAt(840..1860)  .25@990 .45@1212 .6@1360 .9@1860', 40, 30, '#8fd0ff'); label(c, 'wind(t, gusts at 6 and 13 s), 20 s', 40, 70, '#ffcf6a');
  label(c, [840, 990, 1212, 1360, 1860].map(m => S.depthAt(m).toFixed(3)).join('  '), 40, 100);
} };
const snowCase = (bg, tone, opts, w = 1080, h = 1920) => ({ view: [w, h], draw(c, t) {
  BG[bg](c, w, h); const o = Object.assign({ x0: 0, y0: 0, x1: w, y1: h, t, seed: 3, tone }, opts || {});
  S.snow(c, o); label(c, bg + ' ' + tone + ' t=' + t.toFixed(1), 14, 28, bg === 'pale' ? '#223' : '#fff');
} });
CASES.snowDark = snowCase('night', 'dark', { density: 2 });
CASES.snowPale = snowCase('pale', 'light', { density: 2 });
CASES.snowPaleDarkTone = snowCase('pale', 'dark', { density: 2 });
CASES.snowWind = snowCase('night', 'dark', { density: 2, wind: 90, gusts: [[1.5, 1.6, .9]] });
CASES.snowSlices = { view: [1080, 1920], draw(c, t) {
  BG.night(c, 1080, 1920); S.snow(c, { x0: 0, y0: 0, x1: 1080, y1: 1920, t, seed: 5, tone: 'dark', density: 2, slice: 'back' }); dummy(c, 540, 1800, 3); S.snow(c, { x0: 0, y0: 0, x1: 1080, y1: 1920, t, seed: 5, tone: 'dark', density: 2, slice: 'front' });
  label(c, 'back, character, front', 14, 28);
} };
CASES.snowPane = { view: [560, 760], draw(c, t) {
  BG.room(c, 560, 760); c.fillStyle = '#0d1838'; c.fillRect(70, 90, 420, 560); S.snow(c, { x0: 70, y0: 90, x1: 490, y1: 650, t, seed: 9, tone: 'dark', density: 5, layers: 3, wind: 40 });
  c.strokeStyle = '#5b4a36'; c.lineWidth = 16; c.strokeRect(70, 90, 420, 560); label(c, 'window pane, density 5', 14, 28);
} };
CASES.pass = { view: [540, 960], draw(c, t) {
  BG.room(c, 540, 960); dummy(c, 150, 880, 1.2, '#d6303a'); dummy(c, 410, 880, 1.2, '#e8a838'); dummy(c, 270, 700, .8, '#7d9fd8');
  const n = L.pass(c, { ambient: .2, t, lights: [
    { kind: 'cone', x: 40, y: 560, ang: .55 + .06 * Math.sin(t), spread: .62, len: 760, color: '#f4f8ff', flicker: { seed: 3, amt: .05, rate: 1.4 } },
    { kind: 'point', x: 390, y: 520, r: 170, color: '#ffb25a', soft: .8, flicker: { seed: 9, amt: .12, rate: 2 } },
    { kind: 'rect', x: 270, y: 190, w: 260, h: 140, color: '#9fd8ff', soft: .6, facing: PI / 2, power: .9 },
    { kind: 'strip', x: 60, y: 940, x2: 480, y2: 940, width: 40, color: '#cfe8ff', power: .5 },
  ] });
  label(c, 'cone + point + rect (spill) + strip: ' + n, 14, 28);
} };
CASES.passKinds = { view: [1000, 420], draw(c, t) {
  BG.room(c, 1000, 420);
  [['point', 125], ['cone', 375], ['rect', 625], ['strip', 875]].forEach(([k, cx]) => dummy(c, cx, 400, .7));
  L.pass(c, { ambient: .12, vignette: 0, t, lights: [
    { kind: 'point', x: 125, y: 220, r: 140, color: '#ffc070' },
    { kind: 'cone', x: 280, y: 60, ang: 1.1, spread: .7, len: 380, color: '#e6f0ff' },
    { kind: 'rect', x: 625, y: 190, w: 130, h: 90, color: '#a8dcff', facing: PI / 2 },
    { kind: 'strip', x: 790, y: 70, x2: 960, y2: 70, width: 50, color: '#fff0c8' },
  ] });
  label(c, 'point | cone | rect+spill | strip   (ambient .12)', 14, 28);
} };
CASES.passAmbient = { view: [1000, 340], draw(c, t) {
  BG.room(c, 1000, 340);
  [0, .06, .12, .22, .35].forEach((a, i) => { const x = 100 + i * 200; c.save(); c.beginPath(); c.rect(i * 200, 0, 200, 340); c.clip(); dummy(c, x, 320, .75); L.pass(c, { ambient: a, t, vignette: 0, lights: [{ kind: 'point', x, y: 120, r: 110, color: '#ffc070', power: .8 }] }); c.restore(); label(c, 'amb ' + a, i * 200 + 10, 24); });
} };

/* ---- batch 2: frost, sill, bank, cap, beam, breath */
const winPane = (c, x, y, w, h, sky) => { c.fillStyle = sky; c.fillRect(x, y, w, h); };
CASES.frostNight = { view: [1000, 560], draw(c, t) {
  BG.room(c, 1000, 560);
  [.15, .4, .7, 1].forEach((a, i) => { const x = 20 + i * 245, y = 50, w = 215, h = 440; winPane(c, x, y, w, h, '#14224a'); S.snow(c, { x0: x, y0: y, x1: x + w, y1: y + h, t, seed: 4 + i, tone: 'dark', density: 5 });
    S.frost(c, { x, y, w, h, amount: a, seed: 2 + i, t, tone: 'dark' }); c.strokeStyle = '#5b4a36'; c.lineWidth = 12; c.strokeRect(x, y, w, h); label(c, 'amount ' + a, x + 10, 30); });
} };
CASES.frostPale = { view: [1000, 560], draw(c, t) {
  BG.pale(c, 1000, 560);
  [.15, .4, .7, 1].forEach((a, i) => { const x = 20 + i * 245, y = 50, w = 215, h = 440; winPane(c, x, y, w, h, '#b8cce0'); S.snow(c, { x0: x, y0: y, x1: x + w, y1: y + h, t, seed: 4 + i, tone: 'light', density: 5 });
    S.frost(c, { x, y, w, h, amount: a, seed: 2 + i, t, tone: 'light' }); c.strokeStyle = '#7a8a90'; c.lineWidth = 12; c.strokeRect(x, y, w, h); label(c, 'amount ' + a, x + 10, 30, '#223'); });
} };
CASES.frostBig = { view: [540, 720], draw(c, t) {
  BG.room(c, 540, 720); winPane(c, 40, 60, 460, 600, '#0f1c42'); S.snow(c, { x0: 40, y0: 60, x1: 500, y1: 660, t, seed: 7, tone: 'dark', density: 6 }); S.frost(c, { x: 40, y: 60, w: 460, h: 600, amount: 1, seed: 5, t, tone: 'dark' }); c.strokeStyle = '#5b4a36'; c.lineWidth = 14; c.strokeRect(40, 60, 460, 600);
} };
const ledge = (c, x0, x1, y, col = '#6d5a44') => { c.fillStyle = col; c.fillRect(x0 - 10, y, x1 - x0 + 20, 22); c.fillStyle = 'rgba(0,0,0,.25)'; c.fillRect(x0 - 10, y + 22, x1 - x0 + 20, 6); };
CASES.sillNight = { view: [1000, 420], draw(c, t) {
  BG.night(c, 1000, 420); [6, 20, 40, 70].forEach((d, i) => { const x0 = 30 + i * 245; ledge(c, x0, x0 + 205, 290); S.sill(c, { x0, x1: x0 + 205, y: 290, depth: d, seed: 3 + i, tone: 'dark', t }); label(c, 'depth ' + d, x0, 40); });
} };
CASES.sillPale = { view: [1000, 420], draw(c, t) {
  BG.pale(c, 1000, 420); [6, 20, 40, 70].forEach((d, i) => { const x0 = 30 + i * 245; ledge(c, x0, x0 + 205, 290, '#8d9da0'); S.sill(c, { x0, x1: x0 + 205, y: 290, depth: d, seed: 3 + i, tone: 'light', t }); label(c, 'depth ' + d, x0, 40, '#223'); });
} };
CASES.bank = { view: [1000, 700], draw(c, t) {
  BG.pale(c, 1000, 350); c.save(); c.translate(0, 350); c.beginPath(); c.rect(0, 0, 1000, 350); c.clip(); BG.night(c, 1000, 350); c.restore();
  S.bank(c, { x: 170, y: 300, w: 300, h: 130, seed: 1, shade: .6, tone: 'light' }); S.bank(c, { x: 560, y: 320, w: 220, h: 80, seed: 2, shade: .3, flip: true, tone: 'light' }); S.bank(c, { x: 850, y: 310, w: 260, h: 110, seed: 3, shade: .9, tone: 'light' });
  S.bank(c, { x: 170, y: 650, w: 300, h: 130, seed: 1, shade: .6, tone: 'dark', t }); S.bank(c, { x: 560, y: 670, w: 220, h: 80, seed: 2, shade: .3, flip: true, tone: 'dark', t }); S.bank(c, { x: 850, y: 660, w: 260, h: 110, seed: 3, shade: .9, tone: 'dark', t });
} };
CASES.cap = { view: [1000, 560], draw(c, t) {
  BG.pale(c, 1000, 280); c.save(); c.translate(0, 280); c.beginPath(); c.rect(0, 0, 1000, 280); c.clip(); BG.night(c, 1000, 280); c.restore();
  for (const [oy, tone] of [[0, 'light'], [280, 'dark']]) {
    c.fillStyle = '#c4433a'; c.beginPath(); c.roundRect(40, oy + 140, 330, 70, [40, 40, 6, 6]); c.fill(); S.cap(c, { x0: 70, x1: 340, y: oy + 142, depth: 24, seed: 2, round: 1, tone, t });
    c.fillStyle = '#2f5d8a'; c.fillRect(430, oy + 120, 200, 40); S.cap(c, { x0: 430, x1: 630, y: oy + 120, depth: 18, seed: 3, round: 0, tone, t });
    c.fillStyle = '#3d9a45'; c.fillRect(690, oy + 130, 250, 20); S.cap(c, { x0: 690, x1: 940, y: oy + 130, depth: 34, seed: 4, round: .5, tone, t });
  }
} };
CASES.beam = { view: [1000, 640], draw(c, t) {
  BG.night(c, 1000, 640); c.fillStyle = '#1a2a4a'; c.fillRect(0, 520, 1000, 120);
  S.snow(c, { x0: 0, y0: 0, x1: 1000, y1: 640, t, seed: 3, tone: 'dark', density: 3, wind: 50 });
  S.beam(c, { x: 90, y: 440, ang: -.06, spread: .34, len: 800, color: '#fff2c8', alpha: .5, t, seed: 4, wind: 50 });
  S.beam(c, { x: 90, y: 480, ang: .06, spread: .34, len: 800, color: '#fff2c8', alpha: .5, t, seed: 5, wind: 50 });
  c.fillStyle = '#c8c8d0'; c.beginPath(); c.roundRect(30, 410, 70, 90, 14); c.fill();
  S.beam(c, { x: 900, y: 120, ang: PI / 2 + .35, spread: .5, len: 520, color: '#d8ecff', alpha: .45, t, seed: 6, wind: 50, soft: .9 });
} };
CASES.breath = { view: [1000, 560], draw(c, t) {
  BG.pale(c, 500, 560); c.save(); c.translate(500, 0); c.beginPath(); c.rect(0, 0, 500, 560); c.clip(); BG.night(c, 500, 560); c.restore();
  dummy(c, 120, 520, .85); S.breath(c, { x: 150, y: 345, t, seed: 3, dir: 1, size: 1.1 });
  dummy(c, 420, 520, .85); S.breath(c, { x: 390, y: 345, t, seed: 4, dir: -1, size: 1.1, phase: .6 });
  dummy(c, 620, 520, .85); S.breath(c, { x: 650, y: 345, t, seed: 3, dir: 1, size: 1.1 });
  dummy(c, 920, 520, .85); S.breath(c, { x: 890, y: 345, t, seed: 4, dir: -1, size: 1.1, phase: .6 });
} };

/* ---- batch 3: spray, flurry, emergency, lamps, settle (maskPoints) */
CASES.spray = { view: [1000, 480], draw(c, t) {
  BG.pale(c, 500, 480); c.save(); c.translate(500, 0); c.beginPath(); c.rect(0, 0, 500, 480); c.clip(); BG.night(c, 500, 480); c.restore();
  for (const [ox, tone] of [[0, 'light'], [500, 'dark']]) {
    c.save(); c.translate(ox, 0); c.fillStyle = tone === 'dark' ? '#2a3a5a' : '#7e8a90'; c.fillRect(0, 400, 500, 80); c.fillStyle = '#e8892b'; c.beginPath(); c.roundRect(40, 330, 110, 80, 10); c.fill(); c.fillStyle = '#9aa0a8'; c.fillRect(150, 345, 18, 70);
    S.spray(c, { x: 170, y: 395, ang: -.7, t, t0: .1, t1: 2.2, seed: 3, power: 1 }); S.spray(c, { x: 170, y: 395, ang: -2.4, t, t0: 1.2, t1: 3.2, seed: 8, power: .7, width: .6 }); c.restore();
  }
  label(c, 'spray t=' + t.toFixed(2), 14, 28, '#223');
} };
CASES.flurry = { view: [1000, 300], draw(c, t) {
  BG.pale(c, 500, 300); c.save(); c.translate(500, 0); c.beginPath(); c.rect(0, 0, 500, 300); c.clip(); BG.night(c, 500, 300); c.restore();
  [[.05, 90], [.2, 230], [.45, 370], [.8, 560], [1.2, 700], [1.8, 840]].forEach(([a, x], i) => { S.flurry(c, { x, y: 170, r: 70, t: a, t0: 0, life: 1.4, seed: 2 + i }); });
  label(c, 'flurry ages .05 .2 .45 .8 1.2 1.8', 14, 28, '#223');
} };
CASES.emergency = { view: [540, 960], draw(c, t) {
  BG.room(c, 540, 960); dummy(c, 150, 880, 1.2); dummy(c, 410, 880, 1.2, '#e8a838');
  L.pass(c, { ambient: .2, t, lights: [{ kind: 'point', x: 270, y: 300, r: 260, color: '#ffd9a0' }] });
  L.emergency(c, { level: Math.min(1, t / 1.5), t, pulse: .15 }); label(c, 'emergency level ' + Math.min(1, t / 1.5).toFixed(2), 14, 28);
} };
CASES.lamps = { view: [800, 400], draw(c, t) {
  BG.room(c, 800, 400); c.fillStyle = '#3a2a1c'; c.fillRect(0, 300, 800, 100);
  const cs = [[150, 280], [330, 285], [520, 278], [680, 283]]; for (const [x, y] of cs) { c.fillStyle = '#eee'; c.beginPath(); c.roundRect(x - 14, y - 40, 28, 40, 4); c.fill(); }
  L.pass(c, { ambient: .16, t, lights: cs.map(([x, y], i) => ({ kind: 'point', x, y: y - 44, r: 150, color: '#ffbe6a', power: .8, flicker: { seed: i + 1, amt: .12, rate: 1.4 } })) });
  L.lamps(c, cs.map(([x, y], i) => ({ x, y: y - 44, r: 46, color: '#ffbe6a', flicker: { seed: i + 1, amt: .12, rate: 1.4 } })), { t });
} };
let TITLE_PTS = null;
CASES.settle = { view: [1000, 560], draw(c, t) {
  BG.night(c, 1000, 560);
  if (!TITLE_PTS) TITLE_PTS = S.maskPoints(g => { g.fillStyle = '#000'; g.font = '900 150px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('SHIFT', 500, 150); g.fillText('HAPPENS', 500, 330); }, 1000, 480, 7, 3);
  c.save(); c.translate(0, 40); S.settle(c, { pts: TITLE_PTS, from: { x: 500, y: 240, r: 260 }, t, t0: 1.0, t1: 3.2, seed: 5, size: 7 }); c.restore();
  label(c, 'settle t=' + t.toFixed(2) + ' pts ' + TITLE_PTS.length, 14, 28);
} };

/* ---- the pass under a camera: zoom, pan and roll must carry the lights with the picture (a marker sits exactly where each light is) */
CASES.passCam = { view: [900, 520], draw(c, t) {
  BG.room(c, 900, 520);
  [[0, 1, 0], [300, 1.6, 0], [600, 1, .25]].forEach(([ox, z, roll], i) => {
    c.save(); c.beginPath(); c.rect(ox, 0, 300, 520); c.clip(); c.translate(ox + 150, 260); c.rotate(roll); c.scale(z, z); c.translate(-150, -260);
    c.fillStyle = 'rgba(255,255,255,.12)'; for (let k = 0; k < 6; k++) c.fillRect(30 + k * 40, 60, 20, 400);
    dummy(c, 150, 480, .8); const lx = 150, ly = 300;
    c.fillStyle = '#ff2'; c.beginPath(); c.arc(lx, ly, 4, 0, TAU); c.fill();
    L.pass(c, { ambient: .1, vignette: 0, bloom: 0, t, lights: [{ kind: 'point', x: lx, y: ly, r: 90, color: '#ffc070' }, { kind: 'cone', x: 40, y: 120, ang: .7, spread: .5, len: 300, color: '#e6f0ff', power: .8 }] });
    c.restore(); label(c, 'zoom ' + z + ' roll ' + roll, ox + 8, 24);
  });
} };

/* @@CASES@@ */

/* ---- rendering */
function renderCase(name, t) { const cs = CASES[name], cv = mk(cs.view[0], cs.view[1]), c = cv.getContext('2d'); cs.draw(c, t); return cv; }
/* names: cases; times: seconds; cellW: width of one tile. Rows = names, columns = times. */
function sheet(names, times, cellW = 340) {
  const gap = 6, rows = names.map(n => { const v = CASES[n].view; return Math.round(cellW * v[1] / v[0]); });
  const cv = document.getElementById('c'), Wd = times.length * (cellW + gap) + gap, Hd = rows.reduce((a, b) => a + b + gap, gap);
  cv.width = Wd; cv.height = Hd; const c = cv.getContext('2d'); c.fillStyle = '#000'; c.fillRect(0, 0, Wd, Hd);
  let y = gap;
  names.forEach((n, ri) => { times.forEach((t, ci) => { c.drawImage(renderCase(n, t), gap + ci * (cellW + gap), y, cellW, rows[ri]); }); y += rows[ri] + gap; });
  return cv.toDataURL('image/png');
}
function one(name, t) { const cv = document.getElementById('c'), r = renderCase(name, t); cv.width = r.width; cv.height = r.height; cv.getContext('2d').drawImage(r, 0, 0); return cv.toDataURL('image/png'); }
/* pixel hash of a case at t: for the determinism test */
function hashCase(name, t) { const cv = renderCase(name, t), d = cv.getContext('2d').getImageData(0, 0, cv.width, cv.height).data; let h = 2166136261; for (let i = 0; i < d.length; i++) { h ^= d[i]; h = Math.imul(h, 16777619); } return (h >>> 0).toString(16) + ':' + d.length; }
/* wall-clock cost (ms per draw, averaged) of the SN20 and L20 calls inside one case, rasterised for real: the case is drawn n times with a pixel read-back after each (the canvas defers its drawing until it is read),
 * once with the kit calls and once with every kit call stubbed out; the difference is the kit's cost. The backgrounds, dummies and labels cancel out. */
const NOT_FX = new Set(['SCENE_CLOCK', 'depthAt', 'wind', 'windInt', 'GUST', 'maskPoints']);
function cost(name, t, n = 30) {
  const cs = CASES[name], cv = mk(cs.view[0], cs.view[1]), c = cv.getContext('2d');
