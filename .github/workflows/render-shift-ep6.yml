name: Render Shift Happens Episode 6
# Manual only. Renders the committed Episode 6 audio and timeline (build/ep6/audio.m4a, timeline.js), runs the strict
# 30 fps layout audit, and uploads the MP4 and the QA record as a workflow artifact. It never commits or pushes.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg chromium
          cd fruit-video
          npm install --no-save playwright
      - name: Layout audit, every frame at 30 fps (hard gate)
        working-directory: fruit-video
        env:
          EP: '6'
          CHROMIUM: /usr/bin/chromium
        run: |
          mkdir -p build/ep6
          node render.js audit 0.0333333333 | tee build/ep6/layout_audit.log
          test ${PIPESTATUS[0]} -eq 0
      - name: Render H.264/AAC MP4 from the committed audio
        working-directory: fruit-video
        env:
          EP: '6'
          CHROMIUM: /usr/bin/chromium
          WORKERS: '4'
          FMT: 'image/png'
          CRF: '21'
          AUDIO: build/ep6/audio.m4a
        run: |
          node render.js video shift-happens-ep6.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height,r_frame_rate -of json shift-happens-ep6.mp4 | tee build/ep6/ffprobe.json
          ffmpeg -v error -i shift-happens-ep6.mp4 -f null -
      - name: Save the movie and the QA record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shift-happens-ep6-review
          path: |
            fruit-video/shift-happens-ep6.mp4
            fruit-video/build/ep6/ffprobe.json
            fruit-video/build/ep6/layout_audit.log
          if-no-files-found: warn
          retention-days: 30
