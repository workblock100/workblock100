name: Render Shift Happens Episode 6
on:
  pull_request:
    paths:
      - '.github/workflows/render-shift-ep6.yml'
      - 'fruit-video/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/fruit-ai-video-nurse-98w13m
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg chromium espeak-ng libsndfile1
          python -m pip install kokoro-onnx soundfile scipy numpy
          cd fruit-video
          npm install --no-save playwright
      - name: Run Episode 6 source preflight
        working-directory: fruit-video
        run: node ep6_preflight.js
      - name: Fetch Kokoro voices and fp16 model
        working-directory: fruit-video
        run: |
          curl --fail --location --retry 3 -o /tmp/kokoro-v1.0.fp16.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.fp16.onnx
          curl --fail --location --retry 3 -o /tmp/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
          test $(stat -c %s /tmp/kokoro-v1.0.fp16.onnx) -gt 100000000
          test $(stat -c %s /tmp/voices-v1.0.bin) -gt 10000000
      - name: Build Episode 6 voiced audio and precise timeline
        working-directory: fruit-video
        run: |
          python build_audio.py --model /tmp/kokoro-v1.0.fp16.onnx --voices /tmp/voices-v1.0.bin --script script_ep6.json --out build/ep6 --var TIMELINE_EP6
          ffmpeg -y -loglevel error -i build/ep6/audio.wav -c:a aac -b:a 192k build/ep6/audio.m4a
      - name: Render previews, 30 fps QA audit
        working-directory: fruit-video
        env:
          EP: '6'
          CHROMIUM: /usr/bin/chromium
        run: |
          node render.js preview 0.2 5 12 35 55 66 82 102 118 140 152
          node render.js audit 0.0333333333 | tee build/ep6/layout_audit.log
          test ${PIPESTATUS[0]} -eq 0
      - name: Render full H264/AAC MP4
        working-directory: fruit-video
        env:
          EP: '6'
          CHROMIUM: /usr/bin/chromium
          WORKERS: '4'
          FMT: 'image/jpeg'
          CRF: '21'
        run: |
          node render.js video shift-happens-ep6.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height,r_frame_rate -of json shift-happens-ep6.mp4 | tee build/ep6/ffprobe.json
          ffmpeg -v error -i shift-happens-ep6.mp4 -f null -
      - name: Save movie, previews and QC
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shift-happens-ep6-review
          path: |
            fruit-video/shift-happens-ep6.mp4
            fruit-video/build/ep6/preview/
            fruit-video/build/ep6/ffprobe.json
            fruit-video/build/ep6/layout_audit.log
          if-no-files-found: warn
          retention-days: 30
      - name: Commit review MP4 to open draft branch
        if: success()
        run: |
          git config user.name "shift-happens-render-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f fruit-video/shift-happens-ep6.mp4 fruit-video/build/ep6/timeline.js fruit-video/build/ep6/audio.m4a
          git diff --cached --quiet || git commit -m "Render Episode 6 review video (not approved for publication)"
          git push origin HEAD:claude/fruit-ai-video-nurse-98w13m
